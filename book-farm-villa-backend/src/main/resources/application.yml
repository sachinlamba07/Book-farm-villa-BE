spring:
  application:
    name: book-farm-villa-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookfarmvilla}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-admin:
    email: ${SEED_ADMIN_EMAIL:admin@bookfarmvilla.com}
    password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health


# AI assistant. Keep provider selection server-side; never expose API keys to the frontend.
ai:
  provider: ${AI_PROVIDER:gemini}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
