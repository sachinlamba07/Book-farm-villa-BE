spring:
  application:
    name: book-farm-villa-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookfarmvilla}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BookFarmVillaPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1500000
      keepalive-time: 0

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        generate_statistics: false
  cache:
    type: caffeine

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:30}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}

app:
  notifications:
    email-to: ${EMAIL_TO:info@bookfarmvilla.com}
    email-from: ${EMAIL_FROM:}
    resend-api-key: ${RESEND_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-admin:
    email: ${SEED_ADMIN_EMAIL:admin@bookfarmvilla.com}
    password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false


# AI assistant. Keep provider selection server-side; never expose API keys to the frontend.
ai:
  provider: ${AI_PROVIDER:gemini}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
