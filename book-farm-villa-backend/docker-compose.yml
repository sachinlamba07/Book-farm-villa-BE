version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookfarmvilla-postgres
    environment:
      POSTGRES_DB: bookfarmvilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bookfarmvilla-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bookfarmvilla
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-me-min-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@bookfarmvilla.com
      SEED_ADMIN_PASSWORD: ChangeMe123!

volumes:
  pgdata:
